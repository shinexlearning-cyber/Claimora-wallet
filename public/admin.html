<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Claimora — Admin</title>
<link rel="stylesheet" href="/admin.css" />
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="brand">
      <div class="logo-mark">C</div>
      <div>
        <div class="brand-title">Claimora · Admin</div>
        <div class="brand-sub">USER DASHBOARD</div>
      </div>
    </div>
    <a class="back" href="/">← Back to Wallet</a>
  </div>

  <div class="card" id="card">
    <div class="card-title">Registered Users</div>
    <div class="card-sub" id="cardSub">Loading…</div>
    <div class="spinner" id="spinner">Loading users…</div>
    <table id="userTable" style="display:none;">
      <thead>
        <tr>
          <th>Wallet Address</th>
          <th>Joined</th>
          <th>Last Login</th>
        </tr>
      </thead>
      <tbody id="userBody"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none;">No users yet.</div>
    <div class="error" id="errorBox" style="display:none;"></div>
  </div>
</div>

<script type="module" src="/admin.js"></script>
</body>
</html>

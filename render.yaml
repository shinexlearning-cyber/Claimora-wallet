services:
  - type: web
    name: claimora
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_WALLETS
        sync: false
      - key: REOWN_PROJECT_ID
        sync: false
      - key: DATABASE_URL
        sync: false
